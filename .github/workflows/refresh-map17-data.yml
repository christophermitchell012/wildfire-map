# v5: build-time snapshots + versioned localStorage + regional polygon layers
name: Refresh Map 17 embedded data

on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * *'
  push:
    paths:
      - 'tools/build_map17_embedded_data.py'
      - 'tools/harden_map17_runtime.py'
      - 'tools/redesign_map17_layers.py'
      - '.github/workflows/refresh-map17-data.yml'

permissions:
  contents: write

jobs:
  build-map17-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build readers
        run: python -m pip install --disable-pip-version-check openpyxl pyshp
      - name: Build authoritative data snapshots
        run: python tools/build_map17_embedded_data.py
      - name: Harden runtime and county reference cache
        run: python tools/harden_map17_runtime.py
      - name: Build regional county geometry and redesign layers
        shell: bash
        run: |
          # The script's source audit must flag real Esri service references, not explanatory prose such as "no ArcGIS/Esri".
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/redesign_map17_layers.py')
          s=p.read_text()
          s=s.replace('not re.search(r"arcgis|FeatureServer|MapServer|ImageServer", final, re.I)', 'not re.search(r"services[0-9]*\\.arcgis\\.com|onemap\\.cdc\\.gov|FeatureServer|MapServer|ImageServer", final, re.I)')
          p.write_text(s)
          PY
          python tools/redesign_map17_layers.py
      - name: Verify Map 17 regional polygon contract
        shell: bash
        run: |
          set -euo pipefail
          f='daily-maps/17-agricultural-drought-farm-exposure.html'
          c='daily-maps/data/county-reference-2025-gazetteer-v1.json'
          ! grep -q 'fetchWithTimeout(GAZ_ZIP' "$f"
          ! grep -q 'USDM_BASE + "?"' "$f"
          ! grep -Eqi 'services[0-9]*\.arcgis\.com|onemap\.cdc\.gov|FeatureServer|MapServer|ImageServer' "$f"
          ! grep -q 'window.fetch = resilientFetch' "$f"
          ! grep -q 'data-mitchellco-performance="gridwatch-v1"' "$f"
          ! grep -q 'renderer: L.canvas(),' "$f"
          grep -q 'id="region"' "$f"
          grep -q 'mitchellco:county-geometry' "$f"
          grep -q 'County boundaries' "$f"
          grep -q 'Drought severity (USDM)' "$f"
          grep -q 'Agricultural exposure' "$f"
          grep -q 'Community vulnerability (CDC SVI)' "$f"
          grep -q 'Highest combined priority' "$f"
          grep -q 'localStorage.getItem(COUNTY_CACHE_KEY)' "$f"
          grep -q 'localStorage.setItem(COUNTY_CACHE_KEY' "$f"
          test -s "$c"
          python - <<'PY'
          import json
          from pathlib import Path
          ref=json.loads(Path('daily-maps/data/county-reference-2025-gazetteer-v1.json').read_text())
          assert ref['version']=='2025-gazetteer-v1' and len(ref['counties'])>=3000
          total=0
          for r in ('northeast','midwest','south','west'):
              p=Path(f'daily-maps/data/county-geometry-2025-cb20m-v1-{r}.geojson')
              assert p.stat().st_size>1000
              g=json.loads(p.read_text())
              assert g['version']=='2025-cb20m-v1' and g['region']==r and len(g['features'])>=100
              total += len(g['features'])
          assert total >= 3100
          print('regional county geometry passed:', total)
          PY
      - name: Commit refreshed Map 17 if changed
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            daily-maps/17-agricultural-drought-farm-exposure.html
            daily-maps/data/county-reference-2025-gazetteer-v1.json
            daily-maps/data/county-geometry-2025-cb20m-v1-northeast.geojson
            daily-maps/data/county-geometry-2025-cb20m-v1-midwest.geojson
            daily-maps/data/county-geometry-2025-cb20m-v1-south.geojson
            daily-maps/data/county-geometry-2025-cb20m-v1-west.geojson
          )
          if git diff --quiet -- "${paths[@]}"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Redesign Map 17 with regional county layers'
          git push
