# v5: build-time dynamic snapshots + versioned county localStorage + regional polygon layers
name: Refresh Map 17 embedded data

on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * *'
  push:
    paths:
      - 'tools/build_map17_embedded_data.py'
      - 'tools/harden_map17_runtime.py'
      - 'tools/redesign_map17_layers.py'
      - '.github/workflows/refresh-map17-data.yml'

permissions:
  contents: write

jobs:
  build-map17-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build readers
        run: python -m pip install --disable-pip-version-check openpyxl pyshp

      - name: Build authoritative snapshots into standalone HTML
        run: python tools/build_map17_embedded_data.py

      - name: Harden runtime and externalize county reference cache
        run: python tools/harden_map17_runtime.py

      - name: Build regional county geometry and redesign layers
        run: python tools/redesign_map17_layers.py

      - name: Verify Map 17 runtime, county cache, regions, and visual layers
        shell: bash
        run: |
          set -euo pipefail
          f='daily-maps/17-agricultural-drought-farm-exposure.html'
          c='daily-maps/data/county-reference-2025-gazetteer-v1.json'
          ! grep -q 'fetchWithTimeout(GAZ_ZIP' "$f"
          ! grep -q 'USDM_BASE + "?"' "$f"
          ! grep -Eqi 'services[0-9]*\.arcgis\.com|onemap\.cdc\.gov|FeatureServer|MapServer|ImageServer' "$f"
          ! grep -q 'window.fetch = resilientFetch' "$f"
          ! grep -q 'data-mitchellco-performance="gridwatch-v1"' "$f"
          ! grep -q 'cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js' "$f"
          ! grep -q 'cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css' "$f"
          test "$(grep -o 'data-map17-leaflet="inline"' "$f" | wc -l)" -eq 2
          grep -q 'BEGIN MAP17 EMBEDDED DATA' "$f"
          grep -q 'const COUNTY_CENTROIDS = Object.freeze({});' "$f"
          grep -q 'const COUNTY_CACHE_VERSION = "2025-gazetteer-v1";' "$f"
          grep -q 'localStorage.getItem(COUNTY_CACHE_KEY)' "$f"
          grep -q 'localStorage.setItem(COUNTY_CACHE_KEY' "$f"
          grep -q 'data/county-reference-2025-gazetteer-v1.json' "$f"
          grep -q 'USDM_SNAPSHOT' "$f"
          grep -q 'id="region"' "$f"
          grep -q 'mitchellco:county-geometry' "$f"
          grep -q 'Drought severity (USDM)' "$f"
          grep -q 'Agricultural exposure' "$f"
          grep -q 'Community vulnerability (CDC SVI)' "$f"
          grep -q 'Highest combined priority' "$f"
          grep -q 'County boundaries' "$f"
          ! grep -q 'renderer: L.canvas(),' "$f"
          test -s "$c"
          for r in northeast midwest south west; do
            g="daily-maps/data/county-geometry-2025-cb20m-v1-${r}.geojson"
            test -s "$g"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('daily-maps/data/county-reference-2025-gazetteer-v1.json').read_text())
          assert p['version'] == '2025-gazetteer-v1'
          assert len(p['counties']) >= 3000
          for fips, county in list(p['counties'].items())[:20]:
              assert len(fips) == 5 and fips.isdigit()
              float(county['lat']); float(county['lon'])
          total = 0
          for r in ('northeast','midwest','south','west'):
              q = json.loads(Path(f'daily-maps/data/county-geometry-2025-cb20m-v1-{r}.geojson').read_text())
              assert q['version'] == '2025-cb20m-v1'
              assert q['region'] == r
              assert len(q['features']) >= 100
              for feat in q['features'][:20]:
                  assert len(feat['properties']['fips']) == 5
                  assert feat['geometry']['type'] in ('Polygon','MultiPolygon')
              total += len(q['features'])
          assert total >= 3100
          print('county + regional geometry validation passed:', len(p['counties']), total)
          PY

      - name: Commit refreshed Map 17 if changed
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            daily-maps/17-agricultural-drought-farm-exposure.html
            daily-maps/data/county-reference-2025-gazetteer-v1.json
            daily-maps/data/county-geometry-2025-cb20m-v1-northeast.geojson
            daily-maps/data/county-geometry-2025-cb20m-v1-midwest.geojson
            daily-maps/data/county-geometry-2025-cb20m-v1-south.geojson
            daily-maps/data/county-geometry-2025-cb20m-v1-west.geojson
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No Map 17 data/runtime changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Redesign Map 17 with regional county layers'
          git push
