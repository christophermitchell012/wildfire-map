name: Standardize Daily Maps

on:
  push:
    branches: [main]
    paths:
      - 'daily-maps/*.html'
      - 'scripts/standardize_daily_maps.py'
      - 'scripts/apply_browser_first_standard.py'
      - 'scripts/optimize_gridwatch.py'
      - 'scripts/optimize_netwatch.py'
      - '.github/workflows/standardize-daily-maps.yml'

permissions:
  contents: write

jobs:
  standardize:
    if: ${{ !contains(github.event.head_commit.message, '[map-standard]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Optimize GridWatch Map 09 when legacy version is present
        shell: bash
        run: |
          if grep -q 'countyIndex: \[\]' daily-maps/09-power-grid-stress-extreme-weather.html; then
            echo 'GridWatch already contains the performance rewrite.'
          else
            python scripts/optimize_gridwatch.py
          fi

      - name: Optimize NetWatch Map 11 when performance rewrite is absent
        shell: bash
        run: |
          if grep -q 'data-netwatch-performance=' daily-maps/11-internet-outage-watch.html; then
            echo 'NetWatch already contains the performance rewrite.'
          else
            python scripts/optimize_netwatch.py
          fi

      - name: Ensure required footer copyright
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path('daily-maps').glob('[0-9][0-9]-*.html')):
              text = path.read_text(encoding='utf-8')
              if '© 2026 MitchellCo Inc.' in text:
                  continue
              footer = '<div class="copy">© 2026 MitchellCo Inc.</div>'
              if '</aside>' in text:
                  text = text.replace('</aside>', footer + '\n</aside>', 1)
              elif '</body>' in text:
                  text = text.replace('</body>', footer + '\n</body>', 1)
              else:
                  raise SystemExit(f'{path}: cannot place copyright footer')
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Apply shared map standard
        run: python scripts/standardize_daily_maps.py

      - name: Apply browser-first performance safeguards
        run: python scripts/apply_browser_first_standard.py

      - name: Pretty-print all map HTML
        run: npx --yes prettier@3.3.3 --write 'daily-maps/*.html'

      - name: Validate standards before commit
        run: |
          python scripts/standardize_daily_maps.py --check
          python scripts/apply_browser_first_standard.py --check

      - name: Check inline JavaScript syntax before commit
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, tempfile, sys
          bad = []
          for path in sorted(pathlib.Path('daily-maps').glob('[0-9][0-9]-*.html')):
              text = path.read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, flags=re.I|re.S)
              for i, body in enumerate(scripts, 1):
                  with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                      f.write(body)
                      tmp = f.name
                  p = subprocess.run(['node', '--check', tmp], capture_output=True, text=True)
                  pathlib.Path(tmp).unlink(missing_ok=True)
                  if p.returncode:
                      bad.append((path.name, i, p.stderr.strip()))
          if bad:
              for name, idx, err in bad:
                  print(f'{name} inline script #{idx}:\n{err}')
              sys.exit(1)
          print('All inline JavaScript passed node --check.')
          PY

      - name: Commit standardized maps
        run: |
          if git diff --quiet -- daily-maps; then
            echo 'No map changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily-maps/*.html
          git commit -m 'Apply browser-first performance standard [map-standard]'
          git push
