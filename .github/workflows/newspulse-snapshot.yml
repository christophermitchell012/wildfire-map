name: NewsPulse snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/newspulse-snapshot.yml'
      - 'scripts/newspulse_snapshot.py'
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: newspulse-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build NewsPulse from GDELT lastupdate raw files
        run: python scripts/newspulse_snapshot.py
      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- daily-maps/data/newspulse.json daily-maps/data/newspulse-state.json; then
            echo "No NewsPulse change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-maps/data/newspulse.json daily-maps/data/newspulse-state.json
          git commit -m "Refresh NewsPulse raw GDELT snapshot"
          git pull --rebase origin main
          git push
