name: NewsPulse snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/newspulse-snapshot.yml'
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: newspulse-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch keyless GDELT GEO snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from html import unescape

          API = 'https://api.gdeltproject.org/api/v2/geo/geo'
          TOPICS = {
              'unrest': '(protest OR demonstration OR riot)',
              'violence': '(explosion OR bombing OR shooting)',
              'transport': '(derailment OR "airport closure" OR "road closure" OR "train crash" OR "plane crash")',
              'health': '(outbreak OR epidemic OR disease)',
              'economy': '(layoff OR layoffs OR bankruptcy OR "plant closure")',
          }
          href_re = re.compile(r'href=["\']([^"\']+)["\']', re.I)
          tag_re = re.compile(r'<[^>]+>')

          def get_json(query, hours, attempts=3):
              params = urllib.parse.urlencode({
                  'query': query,
                  'mode': 'pointdata',
                  'format': 'geojson',
                  'timespan': f'{hours}h',
                  'maxpoints': '120',
                  'geores': '1',
                  'sortby': 'date',
              })
              url = API + '?' + params
              last = None
              for i in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'MitchellCo-NewsPulse/1.0 (+https://christophermitchell012.github.io/wildfire-map/)'
                      })
                      with urllib.request.urlopen(req, timeout=35) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      last = e
                      time.sleep(2 ** i)
              raise last

          def normalize(doc):
              out = []
              for f in doc.get('features', []):
                  g = f.get('geometry') or {}
                  if g.get('type') != 'Point':
                      continue
                  c = g.get('coordinates') or []
                  if len(c) < 2:
                      continue
                  try:
                      lon, lat = float(c[0]), float(c[1])
                  except Exception:
                      continue
                  p = f.get('properties') or {}
                  html = str(p.get('html') or p.get('HTML') or '')
                  name = str(p.get('name') or p.get('Name') or p.get('location') or p.get('Location') or 'Mapped location')
                  try:
                      count = float(p.get('count', p.get('Count', 1)) or 1)
                  except Exception:
                      count = 1
                  links = []
                  domains = set()
                  for href in href_re.findall(html):
                      href = unescape(href)
                      if not href.startswith(('http://', 'https://')):
                          continue
                      host = urllib.parse.urlparse(href).hostname or ''
                      host = re.sub(r'^www\.', '', host)
                      if host:
                          domains.add(host)
                      if len(links) < 5:
                          links.append({'href': href, 'text': host or 'article'})
                  out.append({
                      'name': tag_re.sub('', unescape(name)).strip() or 'Mapped location',
                      'lat': round(lat, 6), 'lon': round(lon, 6),
                      'count': count,
                      'domains': sorted(domains)[:20],
                      'links': links,
                  })
              return out

          windows = {'6': {}, '12': {}}
          errors = []
          success = 0
          for key, query in TOPICS.items():
              try:
                  base = normalize(get_json(query, 48))
                  success += 1
              except Exception as e:
                  base = []
                  errors.append(f'{key} 48h: {e}')
              for h in (6, 12):
                  try:
                      cur = normalize(get_json(query, h))
                      success += 1
                  except Exception as e:
                      cur = []
                      errors.append(f'{key} {h}h: {e}')
                  windows[str(h)][key] = {'current': cur, 'baseline': base}
                  time.sleep(0.6)

          if success == 0:
              raise SystemExit('All GDELT requests failed; preserving previous snapshot')

          payload = {
              'generated_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'source': 'GDELT GEO 2.0',
              'windows': windows,
              'partial': bool(errors),
              'errors': errors[:20],
          }
          os.makedirs('daily-maps/data', exist_ok=True)
          with open('daily-maps/data/newspulse.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, separators=(',', ':'))
              f.write('\n')
          PY
      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- daily-maps/data/newspulse.json; then
            echo "No snapshot change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-maps/data/newspulse.json
          git commit -m "Refresh NewsPulse GDELT snapshot"
          git push
